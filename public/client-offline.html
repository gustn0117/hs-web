<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>연결을 확인해 주세요 · 하온 고객센터</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        background: #f5f6f8;
        color: #191f28;
        font-family:
          "Pretendard Variable",
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          "Apple SD Gothic Neo",
          sans-serif;
        text-align: center;
        word-break: keep-all;
      }
      .box {
        width: 100%;
        max-width: 360px;
        padding: 37px 28px 30px;
        border-radius: 26px;
        background: white;
        box-shadow: 0 4px 24px rgb(25 42 70 / 3%);
      }
      .icon {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        margin: 0 auto 25px;
        border-radius: 24px;
        color: #3182f6;
        background: #eaf3ff;
      }
      h1 {
        margin: 0;
        font-size: 23px;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1.4;
      }
      p {
        margin: 14px 0 0;
        color: #6b7684;
        font-size: 14px;
        line-height: 1.8;
        letter-spacing: -0.025em;
      }
      button {
        width: 100%;
        margin-top: 28px;
        min-height: 53px;
        padding: 0 24px;
        border: 0;
        border-radius: 14px;
        background: #3182f6;
        color: white;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #9ec6ff;
        outline-offset: 4px;
      }
      .brand {
        margin-top: 25px;
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.14em;
        color: #9ba6b4;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <div class="icon">
        <svg
          width="37"
          height="37"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M4.5 8.5a12 12 0 0 1 15 0M7.5 12a7 7 0 0 1 9 0m-6 3.5a2.7 2.7 0 0 1 3 0M12 19h.01M3 3l18 18"
          />
        </svg>
      </div>
      <h1>잠시 연결이 끊겼어요</h1>
      <p>
        인터넷 연결을 확인해 주세요.<br />연결되면 다시 이어서 볼 수 있어요.
      </p>
      <button type="button" onclick="location.reload()">다시 연결하기</button>
      <div class="brand">HAON</div>
    </main>
  </body>
</html>
