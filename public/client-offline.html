<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>연결이 끊겼습니다 · 하온 고객센터</title>
    <style>
      :root { color-scheme: light; }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 24px;
        background: #f5f5f6;
        color: #0d0d0f;
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        text-align: center;
      }
      .box { max-width: 320px; }
      h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.03em; }
      p { margin: 12px 0 0; color: #6b6b72; font-size: 14px; line-height: 1.7; }
      button {
        margin-top: 24px;
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 12px;
        background: #0a2a5e;
        color: #fff;
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>연결이 끊겼습니다</h1>
      <p>인터넷에 다시 연결되면 그대로 이어서 보실 수 있습니다.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </div>
  </body>
</html>
