<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>하온 고객센터</title>
    <style>
      :root { color-scheme: light; }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background: #0a2a5e;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        text-align: center;
      }
      h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.03em; }
      p { margin: 12px 0 0; color: rgba(255, 255, 255, 0.72); font-size: 14px; line-height: 1.7; }
    </style>
  </head>
  <body>
    <div>
      <h1>연결을 기다리고 있습니다</h1>
      <p>인터넷에 연결되면 고객센터가 열립니다.</p>
    </div>
  </body>
</html>
